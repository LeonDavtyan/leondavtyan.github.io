<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f5ec" />
    <meta name="description" content="Leon Davtyan's games and projects." />
    <title>Leon Davtyan — Projects</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2d302a;
        background: #f8f5ec;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      body::before { content: ""; position: fixed; width: 420px; height: 420px; right: -150px; top: -180px; border-radius: 50%; background: #ffe6a5; filter: blur(15px); opacity: .7; pointer-events: none; }
      main { position: relative; width: min(100% - 40px, 720px); margin: 0 auto; padding: clamp(64px, 12vh, 110px) 0 60px; }
      .eyebrow { margin: 0 0 15px; color: #b86a29; font-size: 12px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
      .hero { display: grid; grid-template-columns: minmax(0, 1fr) 190px; align-items: center; gap: 22px; }
      h1 { margin: 0; font-size: clamp(52px, 11vw, 92px); line-height: .99; letter-spacing: -.075em; font-weight: 850; }
      .intro { max-width: 470px; margin: 23px 0 70px; color: #62665b; font-size: clamp(17px, 2.5vw, 20px); line-height: 1.5; }
      .avatar-wrap { position: relative; display: grid; place-items: center; width: 190px; height: 190px; border: 2px solid #ecd9ad; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fffaf0, #ffe7ae); box-shadow: 0 8px 22px #9e763020; }
      .avatar-wrap img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }
      .avatar-wrap::after { content: "✦"; position: absolute; top: 5px; right: -8px; color: #e8a62b; font-size: 30px; animation: twinkle 3.5s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: .5; transform: scale(.85) rotate(-12deg); } 50% { opacity: 1; transform: scale(1.12) rotate(12deg); } }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 13px; border-bottom: 2px solid #dcd9cb; }
      h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
      .count { color: #9b9d8f; font-size: 13px; font-weight: 700; }
      .projects { list-style: none; margin: 0; padding: 0; }
      .projects li { border-bottom: 1px solid #deddd2; }
      .projects a { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 15px; min-height: 100px; padding: 17px 4px; color: inherit; text-decoration: none; border-radius: 10px; transition: background .18s, padding .18s; }
      .projects a:hover, .projects a:focus-visible { background: #fff8e8; padding-left: 14px; padding-right: 14px; outline: none; }
      .number { color: #bf8848; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .project-name { display: block; font-size: clamp(22px, 4vw, 27px); font-weight: 750; letter-spacing: -.04em; }
      .project-detail { display: block; margin-top: 4px; color: #77796e; font-size: 14px; }
      .arrow { display: grid; place-items: center; width: 35px; height: 35px; border: 1px solid #c9c9b8; border-radius: 50%; color: #9b5b26; font-size: 21px; line-height: 1; }
      footer { margin-top: 55px; color: #8a8c80; font-size: 13px; }
      footer a { color: #805b36; text-underline-offset: 3px; }
      @media (max-width: 480px) {
        main { width: min(100% - 32px, 720px); padding-top: 55px; }
        .hero { grid-template-columns: 1fr; gap: 22px; }
        .avatar-wrap { grid-row: 1; width: 145px; height: 145px; }
        .intro { margin-bottom: 55px; }
        .projects a { grid-template-columns: 28px 1fr auto; gap: 10px; min-height: 91px; }
        .project-detail { font-size: 12px; }
      }
      @media (prefers-reduced-motion: reduce) { .avatar-wrap::after { animation: none; } .projects a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <div>
          <p class="eyebrow">Hello, I'm</p>
          <h1>Leon<br />Davtyan<span aria-hidden="true">.</span></h1>
          <p class="intro">I make games. Here are a few you can play right now.</p>
        </div>
        <div class="avatar-wrap">
          <img src="assets/avatar.png" width="640" height="640" alt="Illustration of Leon smiling with shoulder-length curly hair" />
        </div>
      </header>

      <section aria-labelledby="projects-heading">
        <div class="section-heading">
          <h2 id="projects-heading">Projects</h2>
          <span class="count">03 games</span>
        </div>
        <ol class="projects">
          <li>
            <a href="https://leondavtyan.github.io/SkateBus/">
              <span class="number">01</span>
              <span><span class="project-name">SkateBus</span><span class="project-detail">Buzz's Star Skate</span></span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a href="https://leondavtyan.github.io/rocket/">
              <span class="number">02</span>
              <span><span class="project-name">Rocket</span><span class="project-detail">Rocket Hopper</span></span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a href="https://leondavtyan.github.io/hulk/">
              <span class="number">03</span>
              <span><span class="project-name">Hulk</span><span class="project-detail">Golden Hulk: Skybound</span></span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
        </ol>
      </section>

      <footer>More on <a href="https://github.com/LeonDavtyan">GitHub</a>.</footer>
    </main>
  </body>
</html>
